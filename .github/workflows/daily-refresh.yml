name: Costco daily refresh
on:
  workflow_dispatch:
  push:
    paths:
      - collect.mjs
      - .github/workflows/daily-refresh.yml
permissions:
  contents: write
concurrency:
  group: costco-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node collect.mjs
      - name: Save validated snapshot
        run: |
          git config user.name "Costco catalog updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated official catalog"
            git push
          fi
